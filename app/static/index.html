<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Zippy Receiver</title>
</head>

<body>

<h2>Zippy Receiver</h2>

<button onclick="loadDevices()">
    Refresh Devices
</button>

<div id="devices"></div>

<script>

async function loadDevices(){

    const response = await fetch("/devices");

    const devices = await response.json();

    const container =
        document.getElementById("devices");

    container.innerHTML = "";

    devices.forEach(device=>{

        container.innerHTML += `
            <div style="margin:20px;padding:15px;border:1px solid gray">

                <h3>${device}</h3>

                <button onclick="startUpload('${device}')">
                    Start Upload
                </button>

                <button onclick="stopUpload('${device}')">
                    Stop Upload
                </button>

            </div>
        `;
    });

}

async function startUpload(device){

    await fetch(
        "/upload/start/"+encodeURIComponent(device),
        {
            method:"POST"
        }
    );

    alert("Upload Started");
}

async function stopUpload(device){

    await fetch(
        "/upload/stop/"+encodeURIComponent(device),
        {
            method:"POST"
        }
    );

    alert("Upload Stopped");
}

loadDevices();

</script>

</body>

</html>
